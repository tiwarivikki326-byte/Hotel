<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a1f2b">
<title>Menu</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Language button: always at the very top -->
<div class="langbar" role="group" aria-label="Language">
  <button type="button" class="lang-btn" data-lang="hi">हिंदी</button>
  <button type="button" class="lang-btn" data-lang="en">English</button>
</div>

<header class="hero">
  <div class="table-badge" id="tableBadge" hidden></div>
  <h1 id="restName">&nbsp;</h1>
  <p id="restTagline"></p>
</header>

<div class="toolbar">
  <input id="search" type="search" autocomplete="off">
  <nav id="chips" class="chips" aria-label="Categories"></nav>
</div>

<main id="menu" class="menu"></main>

<footer class="foot">
  <a id="reviewBtn" class="review-btn" href="#" target="_blank" rel="noopener" hidden></a>
  <p id="footNote"></p>
</footer>

<!-- Photo / video viewer -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-box">
    <button type="button" class="viewer-close" id="viewerClose" aria-label="Close">&times;</button>
    <div id="viewerMedia"></div>
    <div class="viewer-info">
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="viewer-desc" id="viewerDesc"></div>
      <div class="viewer-price" id="viewerPrice"></div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
